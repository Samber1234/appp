<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Acceso Restringido - Autenticación DBA Requerida | TechNova Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        h1, h2, h3, h4, h5, h6, p, span, small, label, th, td, div {
            color: #ffffff;
        }
        .text-bright {
            color: #ffffff !important;
        }
        .text-cyan-bright {
            color: #67e8f9 !important;
        }
        .text-amber-bright {
            color: #fde047 !important;
        }
        .text-emerald-bright {
            color: #6ee7b7 !important;
        }
        .dba-login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, #1e293b 0%, #0b1120 70%);
        }
        .dba-login-card {
            background-color: #162033;
            border: 1px solid #38bdf8;
            border-radius: 14px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
        }
        .dba-input {
            background-color: #0f172a !important;
            border: 1px solid #475569 !important;
            color: #ffffff !important;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
        }
        .dba-input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.25) !important;
        }
        .dba-input::placeholder {
            color: #64748b !important;
        }
        .navbar-db {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 2px solid #38bdf8;
        }
        .sidebar-card, .panel-card {
            background-color: #162033;
            border: 1px solid #475569;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .table-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff !important;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.15s;
        }
        .table-btn span {
            color: #ffffff !important;
        }
        .table-btn:hover, .table-btn.active {
            background-color: #0d9488;
            color: #ffffff !important;
            border-color: #2dd4bf;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.4);
        }
        .table-dark-custom {
            --bs-table-bg: #0f172a;
            --bs-table-striped-bg: #172338;
            --bs-table-hover-bg: #1e314d;
            color: #ffffff !important;
            border-color: #475569;
            font-size: 0.86rem;
        }
        .table-dark-custom th {
            background-color: #1e293b !important;
            color: #67e8f9 !important;
            font-weight: 700;
            border-bottom: 2px solid #38bdf8 !important;
            white-space: nowrap;
        }
        .table-dark-custom td {
            color: #ffffff !important;
            font-weight: 400;
        }
        .sql-editor {
            background-color: #070b14;
            color: #7dd3fc !important;
            border: 1px solid #475569;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.94rem;
            font-weight: 600;
        }
        .sql-editor:focus {
            background-color: #070b14;
            color: #ffffff !important;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.3);
        }
        .btn-quick-sql {
            background-color: #1e293b;
            color: #ffffff !important;
            border: 1px solid #64748b;
            font-weight: 500;
        }
        .btn-quick-sql:hover {
            background-color: #0284c7;
            border-color: #38bdf8;
            color: #ffffff !important;
        }
        .badge-engine {
            font-size: 0.75rem;
            padding: 5px 9px;
            border-radius: 5px;
            font-weight: 700;
        }
        .cell-truncate {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .null-pill {
            background-color: #334155;
            color: #fde047 !important;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- =========================================================================
     1. PORTAL DE LOGIN EXCLUSIVO PARA ADMINISTRADORES DBA (/db-admin)
     ========================================================================= -->
<div id="dba-login-view" class="dba-login-wrapper">
    <div class="dba-login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: rgba(56, 189, 248, 0.12); border: 1px solid #38bdf8;">
                <i class="bi bi-shield-lock-fill text-cyan-bright fs-2"></i>
            </div>
            <h4 class="fw-bold text-bright mb-1">Acceso Restringido DBA</h4>
            <p class="small text-cyan-bright mb-0">Consola de Administración de Base de Datos Políglota</p>
        </div>

        <div id="dba-login-alert" class="alert alert-danger py-2 px-3 small fw-semibold d-none mb-3" style="background:#450a0a; border-color:#dc2626; color:#fecaca;"></div>

        <form onsubmit="event.preventDefault(); dbaLogin();">
            <div class="mb-3">
                <label for="dba-username" class="form-label small fw-bold text-cyan-bright">Usuario o Correo DBA</label>
                <input type="text" id="dba-username" class="form-control dba-input" value="" placeholder="dba.admin@technova.com.pe" autocomplete="username">
            </div>

            <div class="mb-4">
                <label for="dba-password" class="form-label small fw-bold text-cyan-bright">Contraseña de Seguridad DBA</label>
                <input type="password" id="dba-password" class="form-control dba-input" value="" placeholder="********" autocomplete="current-password">
            </div>

            <button type="submit" id="dba-login-btn" class="btn btn-info w-100 fw-bold text-dark py-2">
                <i class="bi bi-key-fill me-1 text-dark"></i>Iniciar Sesión en Gestor BD
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center">
            <small style="color: #94a3b8; font-size: 0.78rem;">
                Acceso exclusivo para Administradores de Base de Datos (DBA) autorizados por TechNova Cloud.
            </small>
        </div>
    </div>
</div>

<!-- =========================================================================
     2. PUNTO DE MONTAJE PROTEGIDO DE LA CONSOLA DBA
     Solo se inyecta tras validar JWT DBA en GET /api/v1/db-admin/console-shell
     ========================================================================= -->
<div id="dba-console-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentTable = 'USER_PROFILE';
let currentColumns = [];
let currentPk = 'id';
let currentRows = [];
let rowModalInstance = null;
let consoleMounted = false;

function getDbaToken() {
    return (sessionStorage.getItem('dba_token') || '').trim();
}

function hasValidDbaToken() {
    const tok = getDbaToken();
    if (!tok) return false;
    const parts = tok.split('.');
    return parts.length === 3 && parts[0].length > 0 && parts[1].length > 0 && parts[2].length > 0;
}

function showDbaLoginError(msg) {
    const alertEl = document.getElementById('dba-login-alert');
    if (!alertEl) return;
    if (!msg) {
        alertEl.classList.add('d-none');
        alertEl.textContent = '';
    } else {
        alertEl.textContent = msg;
        alertEl.classList.remove('d-none');
    }
}

function purgeDbaSessionAndShowLogin(errMsg) {
    sessionStorage.removeItem('dba_token');
    sessionStorage.removeItem('dba_user');
    consoleMounted = false;
    rowModalInstance = null;

    const mount = document.getElementById('dba-console-mount');
    if (mount) mount.innerHTML = '';

    const loginView = document.getElementById('dba-login-view');
    if (loginView) loginView.style.display = 'flex';

    document.title = 'Acceso Restringido - Autenticación DBA Requerida | TechNova Cloud';
    if (errMsg) {
        showDbaLoginError(errMsg);
    }
}

async function dbaLogin() {
    const userEl = document.getElementById('dba-username');
    const passEl = document.getElementById('dba-password');
    const username = userEl ? userEl.value.trim() : '';
    const password = passEl ? passEl.value : '';

    if (!username || !password) {
        showDbaLoginError('Ingrese su usuario/correo DBA y contraseña.');
        return;
    }

    showDbaLoginError('');
    try {
        const res = await fetch('/api/v1/db-admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: username, password: password})
        });
        const data = await res.json();
        if (res.ok && data.token) {
            sessionStorage.setItem('dba_token', data.token);
            sessionStorage.setItem('dba_user', data.email || username);
            if (passEl) passEl.value = '';
            await mountAndInitializeConsole();
        } else {
            showDbaLoginError(data.detail || 'Credenciales DBA inválidas o sin privilegios de administración.');
        }
    } catch (e) {
        showDbaLoginError('Error de conexión con el servidor de autenticación DBA.');
    }
}

async function dbaLogout() {
    const token = getDbaToken();
    if (token) {
        try {
            await fetch('/api/v1/db-admin/logout', {
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token}
            });
        } catch (e) {}
    }
    purgeDbaSessionAndShowLogin('');
}

async function dbAuthFetch(url, options = {}) {
    const token = getDbaToken();
    if (!token) {
        purgeDbaSessionAndShowLogin('Sesión DBA requerida. Inicie sesión para continuar.');
        throw new Error('NO_TOKEN');
    }
    const headers = Object.assign({}, options.headers || {}, {
        'Authorization': 'Bearer ' + token
    });
    const res = await fetch(url, Object.assign({}, options, {headers: headers, cache: 'no-store'}));
    if (res.status === 401 || res.status === 403) {
        purgeDbaSessionAndShowLogin('Su sesión DBA ha expirado o fue revocada. Inicie sesión nuevamente.');
        throw new Error('UNAUTHORIZED');
    }
    return res;
}

async function mountAndInitializeConsole() {
    if (!hasValidDbaToken()) {
        purgeDbaSessionAndShowLogin('');
        return;
    }
    try {
        const res = await dbAuthFetch('/api/v1/db-admin/console-shell');
        if (!res.ok) {
            purgeDbaSessionAndShowLogin('No autorizado para cargar la consola de base de datos.');
            return;
        }
        const html = await res.text();
        const mount = document.getElementById('dba-console-mount');
        if (mount) mount.innerHTML = html;

        const loginView = document.getElementById('dba-login-view');
        if (loginView) loginView.style.display = 'none';

        const badgeEl = document.getElementById('dba-user-badge');
        const dbaUser = sessionStorage.getItem('dba_user') || 'dba.admin@technova.com.pe';
        if (badgeEl) {
            badgeEl.innerHTML = `<i class="bi bi-shield-lock-fill me-1 text-emerald-bright"></i>DBA: ${dbaUser}`;
        }

        document.title = 'TechNova Cloud - Gestor de Bases de Datos Políglota (DBA)';
        consoleMounted = true;
        const modalEl = document.getElementById('rowEditorModal');
        if (modalEl) {
            rowModalInstance = new bootstrap.Modal(modalEl);
        }
        await loadTablesList();
        await loadTableData('USER_PROFILE');
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            purgeDbaSessionAndShowLogin('Error de red al cargar la consola DBA.');
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (hasValidDbaToken()) {
        mountAndInitializeConsole();
    } else {
        purgeDbaSessionAndShowLogin('');
    }
});

window.addEventListener('pageshow', (event) => {
    if (event.persisted || !hasValidDbaToken()) {
        if (!hasValidDbaToken()) {
            purgeDbaSessionAndShowLogin('');
        }
    }
});

function showBanner(msg, isError = false) {
    const banner = document.getElementById('global-alert-banner');
    const textEl = document.getElementById('global-alert-text');
    if (!banner || !textEl) return;
    textEl.textContent = msg;
    banner.classList.toggle('border-danger', isError);
    banner.classList.toggle('border-info', !isError);
    banner.classList.remove('d-none');
}

async function loadTablesList() {
    try {
        const res = await dbAuthFetch('/api/v1/db-admin/tables');
        const data = await res.json();

        const relContainer = document.getElementById('relational-tables-list');
        if (!relContainer) return;
        relContainer.innerHTML = '';
        (data.relational_tables || []).forEach(t => {
            const activeClass = (t.name === currentTable) ? 'active' : '';
            relContainer.innerHTML += `
                <button class="table-btn ${activeClass}" onclick="loadTableData('${t.name}')">
                    <span><i class="bi bi-table me-2 text-cyan-bright"></i>${t.name}</span>
                    <span class="badge bg-info text-dark fw-bold">${t.count}</span>
                </button>
            `;
        });

        const nosqlContainer = document.getElementById('nosql-tables-list');
        if (nosqlContainer) {
            nosqlContainer.innerHTML = `
                <button class="table-btn ${currentTable === 'Clickstream_Events' ? 'active' : ''}" onclick="loadTableData('Clickstream_Events')">
                    <span><i class="bi bi-lightning-charge me-2 text-amber-bright"></i>Clickstream_Events (DynamoDB)</span>
                    <span class="badge bg-info text-dark fw-bold">${data.dynamodb_count ?? 0}</span>
                </button>
                <button class="table-btn ${currentTable === 'REDIS_CACHE' ? 'active' : ''}" onclick="loadTableData('REDIS_CACHE')">
                    <span><i class="bi bi-cpu me-2 text-emerald-bright"></i>REDIS_CACHE (Vectores y TTL 24h)</span>
                    <span class="badge bg-warning text-dark fw-bold">${data.redis_keys ?? 0}</span>
                </button>
            `;
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión con el servidor al cargar la lista de tablas.', true);
        }
    }
}

async function loadTableData(tableName) {
    try {
        currentTable = tableName;
        loadTablesList();

        const titleEl = document.getElementById('current-table-title');
        if (titleEl) titleEl.textContent = `Tabla Activa: ${tableName}`;

        const res = await dbAuthFetch(`/api/v1/db-admin/table/${encodeURIComponent(tableName)}`);
        const data = await res.json();

        currentColumns = data.columns || [];
        currentPk = data.primary_key || currentColumns[0] || 'id';
        currentRows = data.rows || [];

        const subEl = document.getElementById('current-table-subtitle');
        if (subEl) {
            subEl.textContent = `Motor: ${data.engine} | Clave Primaria (PK): ${currentPk} | Total registros: ${currentRows.length}`;
        }

        const isRedis = (tableName === 'REDIS_CACHE');
        const insBtn = document.getElementById('btn-insert-row');
        const clnBtn = document.getElementById('btn-clone-table');
        if (insBtn) insBtn.style.display = isRedis ? 'none' : 'inline-block';
        if (clnBtn) clnBtn.style.display = isRedis ? 'none' : 'inline-block';

        renderTableGrid(currentColumns, currentRows, !isRedis);
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión al consultar los registros de la tabla.', true);
        }
    }
}

function reloadCurrentTable() {
    loadTableData(currentTable);
}

function renderTableGrid(columns, rows, allowActions = true) {
    const thead = document.getElementById('db-table-head');
    const tbody = document.getElementById('db-table-body');
    if (!thead || !tbody) return;

    if (!columns.length) {
        thead.innerHTML = '';
        tbody.innerHTML = '<tr><td class="text-center text-bright py-4 fw-bold">Sin registros para mostrar</td></tr>';
        return;
    }

    let headHtml = '<tr>';
    columns.forEach(c => {
        headHtml += `<th>${c}</th>`;
    });
    if (allowActions) {
        headHtml += '<th class="text-end">Acciones (Editar / Clonar / Eliminar)</th>';
    }
    headHtml += '</tr>';
    thead.innerHTML = headHtml;

    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${columns.length + 1}" class="text-center text-bright py-4 fw-semibold">La tabla está vacía actualmente.</td></tr>`;
        return;
    }

    let bodyHtml = '';
    rows.forEach((r, idx) => {
        bodyHtml += '<tr>';
        columns.forEach(c => {
            let val = r[c];
            if (val === null || val === undefined) {
                val = '<span class="null-pill">NULL</span>';
            } else if (typeof val === 'object') {
                val = `<code class="text-cyan-bright">${JSON.stringify(val)}</code>`;
            } else {
                val = String(val).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            bodyHtml += `<td class="cell-truncate" title="${String(r[c] ?? '')}">${val}</td>`;
        });
        if (allowActions) {
            const pkVal = String(r[currentPk] ?? '').replace(/'/g, "\\'");
            bodyHtml += `
                <td class="text-end text-nowrap">
                    <button class="btn btn-info btn-sm py-0 px-2 me-1 fw-bold text-dark" onclick="openRowModal('edit', ${idx})" title="Editar fila">
                        <i class="bi bi-pencil-square text-dark"></i> Editar
                    </button>
                    <button class="btn btn-primary btn-sm py-0 px-2 me-1 fw-bold" onclick="openRowModal('clone', ${idx})" title="Clonar este registro">
                        <i class="bi bi-copy"></i> Clonar
                    </button>
                    <button class="btn btn-danger btn-sm py-0 px-2 fw-bold" onclick="deleteRow('${pkVal}')" title="Eliminar fila">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
        }
        bodyHtml += '</tr>';
    });
    tbody.innerHTML = bodyHtml;
}

function openRowModal(mode, rowIndex = null) {
    const form = document.getElementById('row-editor-form');
    const cloneNote = document.getElementById('clone-helper-note');
    if (!form || !cloneNote) return;
    form.innerHTML = '';

    let rowData = {};
    if ((mode === 'edit' || mode === 'clone') && rowIndex !== null) {
        rowData = Object.assign({}, currentRows[rowIndex]);
    }

    if (mode === 'clone') {
        cloneNote.classList.remove('d-none');
        const origPk = rowData[currentPk];
        if (typeof origPk === 'number' || (!isNaN(origPk) && String(origPk).trim() !== '')) {
            rowData[currentPk] = Number(origPk) + Math.floor(Math.random() * 900 + 100);
        } else {
            rowData[currentPk] = `${origPk || 'ID'}_CLON_${Math.floor(Math.random() * 900 + 100)}`;
        }
        if (rowData.email) {
            rowData.email = `clon_${Math.floor(Math.random() * 900 + 100)}_${rowData.email}`;
        }
    } else {
        cloneNote.classList.add('d-none');
    }

    const titles = {
        edit: `Editar Registro en ${currentTable}`,
        clone: `Clonar Registro en ${currentTable}`,
        insert: `Nuevo Registro en ${currentTable}`
    };
    document.getElementById('rowEditorModalTitle').textContent = titles[mode] || `Registro en ${currentTable}`;

    currentColumns.forEach(col => {
        const val = rowData[col] !== undefined && rowData[col] !== null ? rowData[col] : '';
        form.innerHTML += `
            <div class="col-md-6">
                <label class="form-label small text-cyan-bright fw-bold mb-1">${col} ${col === currentPk ? '(Clave Primaria)' : ''}</label>
                <input type="text" class="form-control form-control-sm bg-dark text-bright border-light fw-semibold"
                       name="${col}" value="${String(val).replace(/"/g, '&quot;')}">
            </div>
        `;
    });
    if (rowModalInstance) rowModalInstance.show();
}

async function saveRowChanges() {
    const form = document.getElementById('row-editor-form');
    if (!form) return;
    const inputs = form.querySelectorAll('input');
    const payload = {};
    inputs.forEach(inp => {
        if (inp.value !== '') {
            payload[inp.name] = inp.value;
        }
    });

    try {
        const res = await dbAuthFetch(`/api/v1/db-admin/table/${encodeURIComponent(currentTable)}/row`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({row: payload})
        });
        const data = await res.json();
        if (res.ok) {
            if (rowModalInstance) rowModalInstance.hide();
            showBanner(`Registro guardado correctamente en la tabla ${currentTable}.`);
            loadTableData(currentTable);
        } else {
            showBanner('Error al guardar en base de datos: ' + (data.detail || JSON.stringify(data)), true);
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión con el servidor al guardar cambios.', true);
        }
    }
}

async function cloneCurrentTable() {
    const defaultName = `${currentTable}_CLON`;
    const newName = prompt(`Ingrese el nombre para la nueva tabla clonada a partir de '${currentTable}':`, defaultName);
    if (!newName) return;

    try {
        const res = await dbAuthFetch(`/api/v1/db-admin/table/${encodeURIComponent(currentTable)}/clone-table`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({new_table_name: newName})
        });
        const data = await res.json();
        if (res.ok) {
            showBanner(data.message);
            await loadTablesList();
            loadTableData(data.new_table);
        } else {
            showBanner('Error al clonar tabla: ' + (data.detail || 'Error'), true);
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión al clonar la tabla.', true);
        }
    }
}

async function cloneFullDatabase() {
    try {
        const res = await dbAuthFetch('/api/v1/db-admin/clone-database', {method: 'POST'});
        const data = await res.json();
        if (res.ok) {
            showBanner(`${data.message} Archivos creados: ${data.files_created.join(', ')}`);
        } else {
            showBanner('Error al clonar la base de datos: ' + (data.detail || ''), true);
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión al clonar la base de datos.', true);
        }
    }
}

async function deleteRow(pkValue) {
    if (!confirm(`¿Seguro que deseas eliminar el registro con ${currentPk} = ${pkValue} de la tabla ${currentTable}?`)) {
        return;
    }
    try {
        const res = await dbAuthFetch(`/api/v1/db-admin/table/${encodeURIComponent(currentTable)}/row?pk_col=${encodeURIComponent(currentPk)}&pk_val=${encodeURIComponent(pkValue)}`, {
            method: 'DELETE'
        });
        if (res.ok) {
            showBanner(`Registro '${pkValue}' eliminado de ${currentTable}.`);
            loadTableData(currentTable);
        } else {
            const err = await res.json();
            showBanner('No se pudo eliminar: ' + (err.detail || 'Error'), true);
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión al eliminar registro.', true);
        }
    }
}

function setQuickQuery(sql, targetDb) {
    document.getElementById('sql-query-input').value = sql;
    document.getElementById('sql-target-db').value = targetDb;
    executeCustomSql();
}

async function executeCustomSql() {
    const sql = document.getElementById('sql-query-input').value.trim();
    const targetDb = document.getElementById('sql-target-db').value;
    const msgEl = document.getElementById('sql-status-msg');
    if (!msgEl) return;

    try {
        const res = await dbAuthFetch('/api/v1/db-admin/query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sql: sql, target_db: targetDb})
        });
        const data = await res.json();
        if (!res.ok) {
            msgEl.innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-exclamation-octagon me-1"></i>Error SQL: ${data.detail}</span>`;
            return;
        }

        msgEl.innerHTML = `<span class="text-emerald-bright fw-bold"><i class="bi bi-check-circle me-1"></i>${data.message}</span>`;
        if (data.columns && data.rows) {
            document.getElementById('current-table-title').textContent = 'Resultado de Consulta SQL';
            document.getElementById('current-table-subtitle').textContent = `${data.rows.length} filas devueltas`;
            renderTableGrid(data.columns, data.rows, false);
        }
        loadTablesList();
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            msgEl.innerHTML = '<span class="text-danger fw-bold">Error de conexión con el servidor SQL.</span>';
        }
    }
}

async function resetFactoryData() {
    if (!confirm('¿Restaurar todas las tablas SQL, DynamoDB y Redis a los valores iniciales de fábrica?')) {
        return;
    }
    try {
        localStorage.removeItem('tn_profile_cache');
        localStorage.removeItem('tn_alert_cache');
        localStorage.removeItem('tn_telemetry_sync_buffer');
        const res = await dbAuthFetch('/api/v1/system/reset-demo', {method: 'POST'});
        if (res.ok) {
            showBanner('Bases de datos restauradas a los valores iniciales de fábrica.');
            loadTableData(currentTable);
        } else {
            showBanner('Error al restaurar datos de fábrica.', true);
        }
    } catch (e) {
        if (e.message !== 'NO_TOKEN' && e.message !== 'UNAUTHORIZED') {
            showBanner('Error de conexión al restaurar datos de fábrica.', true);
        }
    }
}
